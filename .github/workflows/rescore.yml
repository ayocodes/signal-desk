# One org, one quick job, started by the web app (lib/rescore.ts):
#   mode=rescore    re-score the leads with the newest rules (after a save, restore or reset)
#   mode=sequences  send the sequence steps that are due (after an admin fast-forward)
# No scraping. Both modes share one queue per org.
name: rescore

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: "Organization id (uuid)"
        required: true
        type: string
      mode:
        description: "rescore or sequences"
        required: false
        default: rescore
        type: choice
        options: [rescore, sequences]

permissions:
  contents: read

# One re-score per org at a time; another waits instead of overlapping (GitHub keeps at most
# one waiting, and the running one already loops to pick up newer saves).
concurrency:
  group: rescore-${{ inputs.org_id }}
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install the agent
        run: pip install -r agent/requirements.txt

      - name: Run the job
        # Inputs go through env variables, never pasted into the command, so they can't inject
        # shell; the mode must be one of the two below and the agent refuses a non-uuid org id.
        run: |
          case "$MODE" in rescore|sequences) ;; *) echo "Unknown mode" >&2; exit 2 ;; esac
          python -m agent.main "--$MODE" --org "$ORG_ID"
        env:
          ORG_ID: ${{ inputs.org_id }}
          MODE: ${{ inputs.mode }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          AGENT_USER_AGENT: ${{ secrets.AGENT_USER_AGENT }}
          LLM_DAILY_BUDGET: ${{ vars.LLM_DAILY_BUDGET }}
