# The background agent: one tick every 30 minutes, plus a manual "Run workflow" button.
# Off the top of the hour (7 and 37 past), when GitHub's scheduler is least busy.
# Note: GitHub pauses schedules in public repos after 60 days without commits.
name: agent

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never two ticks at once; a slow tick makes the next one wait instead of overlapping.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install the agent
        run: pip install -r agent/requirements.txt

      - name: Today's date (UTC), for the dataset cache key
        id: today
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The YC dataset (about 10 MB) is downloaded at most once a day; other ticks reuse it.
      - name: Restore the YC dataset cache
        uses: actions/cache@v6
        with:
          path: agent/.cache
          key: yc-dataset-${{ steps.today.outputs.day }}
          restore-keys: yc-dataset-

      - name: Run one agent tick
        run: python -m agent.main --once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          AGENT_USER_AGENT: ${{ secrets.AGENT_USER_AGENT }}
          # Ashby answers 403 to GitHub's runners, so scheduled runs check Greenhouse and Lever
          # only; Ashby is checked by local runs (npm run agent:local). We never route around it.
          AGENT_JOB_BOARDS: greenhouse,lever
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
          # Unset means the agent's defaults: 40 probes and 5 drafts per tick.
          DISCOVERY_PROBES_PER_RUN: ${{ vars.DISCOVERY_PROBES_PER_RUN }}
          DRAFTS_PER_RUN: ${{ vars.DRAFTS_PER_RUN }}
